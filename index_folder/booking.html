
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPL Ticket Booking Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>IPL 2026 Ticket Booking</h1>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#matches">Matches</a></li>
            <li><a href="booking.html">Book Tickets</a></li>
        </ul>
    </nav>

</header>

<main>

    <section>

        <h2>Ticket Booking Form</h2>
<button type="button" id="scrollToBooking">
    Book Now
</button>
      <form id="bookingForm"

            <!-- Name -->
            <label for="name">Name:</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                minlength="3"
                maxlength="40"
                required
            >

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                maxlength="60"
                required
            >

            <br><br>

            <!-- Phone Number -->
            <label for="phone">Phone Number:</label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter 10 digit number"
                pattern="[0-9]{10}"
                minlength="10"
                maxlength="10"
                title="Enter exactly 10 digits"
                required
            >

            <br><br>

            <!-- Match Selection -->
            <label for="match">Select Match:</label>

            <select id="match" name="match" required>

                <option value="">-- Select Match --</option>

                <option value="RCB vs MI">RCB vs Mumbai Indians</option>

                <option value="CSK vs KKR">CSK vs Kolkata Knight Riders</option>

                <option value="DC vs SRH">Delhi Capitals vs Sunrisers Hyderabad</option>

                <option value="RR vs PBKS">Rajasthan Royals vs Punjab Kings</option>

                <option value="SRH vs CSK">Sunrisers Hyderabad vs CSK</option>

                <option value="KKR vs RCB">KKR vs RCB</option>

            </select>

            <br><br>

            <!-- Stand Category -->
            <label for="stand">Stand Category:</label>

            <select id="stand" name="stand" required>

                <option value="">-- Select Stand --</option>

                <option value="General">General Stand</option>

                <option value="Premium">Premium Stand</option>

                <option value="VIP">VIP Stand</option>

            </select>

            <br><br>

            <!-- Number of Tickets -->
            <label for="tickets">Number of Tickets:</label>

            <input
                type="number"
                id="tickets"
                name="tickets"
                min="1"
                max="10"
                value="1"
                required
            >

            <br><br>

            <!-- Radio Buttons -->
            <fieldset>

                <legend>Booking Preference</legend>

                <input
                    type="radio"
                    id="together"
                    name="preference"
                    value="Seats Together"
                    required
                >

                <label for="together">Seats Together</label>

                <br>

                <input
                    type="radio"
                    id="any"
                    name="preference"
                    value="Any Available Seats"
                >

                <label for="any">Any Available Seats</label>

            </fieldset>

            <br>

            <!-- Checkbox -->
            <input
                type="checkbox"
                id="terms"
                name="terms"
                value="accepted"
                required
            >

            <label for="terms">
                I agree to the booking terms and conditions.
            </label>

            <br><br>

            <!-- Submit and Reset -->
            <button type="submit">Submit Booking</button>

            <button type="reset">Reset Form</button>
    

        </form>
        <div id="toast"></div>
        <p id="successMessage"></p>

        <br>

        <a href="index.html">Back to Home</a>

    </section>

</main>

<footer>

    <p>&copy; 2026 IPL Ticket Booking. All Rights Reserved.</p>

</footer>
<script src="app.js"></script>
</body>
<script>

function showSuccess(event) {

    event.preventDefault();

    document.getElementById("successMessage").innerHTML =
        "Congratulations! Your ticket booking form was submitted successfully!";

    document.getElementById("successMessage").style.color = "green";

}

</script>
</html>
